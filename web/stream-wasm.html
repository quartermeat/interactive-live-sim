<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,user-scalable=no"><title>Avatar Arena</title><style>html,body{width:100vw;height:100vh;margin:0;padding:0;overflow:hidden;background:#05060b}body{display:block}canvas{display:block!important;width:100vw!important;height:100vh!important;margin:0;padding:0}</style></head>
<body>
<canvas id="arena" width="1080" height="1980" aria-label="Avatar Arena"></canvas>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("arena.wasm?v=2"), go.importObject).then(result => go.run(result.instance));
</script>
</body>
